name: AI — SISTAJA Langsung

on:
  repository_dispatch:
    types:
      - dari-apps-script
      - tanya-dari-web

jobs:
  pintar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Buat halaman utama langsung
        env:
          DOKUMEN: ${{ github.event.client_payload.dokumen }}
          PERTANYAAN: ${{ github.event.client_payload.pertanyaan }}
          API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          if [ "$PERTANYAAN" = "perbarui-saja" ]; then
            TAMPILAN="<div class='kotak sistem'><strong>📢 Sistem:</strong> Dokumen siap — $(echo "$DOKUMEN" | wc -c) karakter dibaca.<br><br>Tulis pertanyaan di bawah ini.</div>"
          else
            DOKUMEN_POTONG=$(echo "$DOKUMEN" | cut -c 1-40000)
            
            RESPONS=$(curl -s -X POST "https://api.cerebras.ai/v1/chat/completions" \
              -H "Authorization: Bearer $API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"llama3.1-8b-instruct\",\"messages\":[{\"role\":\"system\",\"content\":\"Jawab hanya berdasarkan dokumen. Bahasa Indonesia jelas.\"},{\"role\":\"user\",\"content\":\"DOKUMEN:\n$DOKUMEN_POTONG\n\nPERTANYAAN:\n$PERTANYAAN\"}],\"temperature\":0.4,\"max_tokens\":1000}")
            
            JAWABAN=$(echo "$RESPONS" | sed -n 's/.*"content":"\([^"]*\)".*/\1/p' | sed 's/\\n/\n/g' | sed 's/\\\//g')
            
            [ -z "$JAWABAN" ] && JAWABAN="Maaf, kunci AI belum terhubung. Coba lagi nanti."
            
            TAMPILAN="<div class='kotak tanya'><strong>👤 Pertanyaan:</strong><br>$PERTANYAAN</div><div class='kotak jawab'><strong>🤖 Jawaban:</strong><br>$JAWABAN</div>"
          fi

          cat > index.html << AKHIR
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI SISTAJA — Tanya Dokumen</title>
  <style>
    *{box-sizing:border-box}
    body{font-family:system-ui,sans-serif;max-width:700px;margin:2rem auto;padding:0 1rem;line-height:1.7}
    h1{color:#1e40af;font-size:1.4rem;text-align:center}
    .kotak{padding:1.2rem;border-radius:12px;margin:1rem 0;white-space:pre-wrap}
    .sistem{background:#fefce8;border-left:4px solid #eab308}
    .tanya{background:#eff6ff;border-left:4px solid #3b82f6}
    .jawab{background:#f0fdf4;border-left:4px solid #22c55e}
    input{width:100%;padding:0.9rem;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin:0.5rem 0}
    button{background:#2563eb;color:white;border:none;padding:0.9rem 1.5rem;border-radius:8px;font-size:1rem;cursor:pointer;width:100%}
    button:disabled{background:#94a3b8}
    .pesan{margin-top:1rem;padding:1rem;border-radius:8px;display:none}
    .info{display:block;background:#e6fffa}
  </style>
</head>
<body>
  <h1>⚡ AI SISTAJA</h1>
  <form onsubmit="kirim(event)">
    <input type="text" id="q" placeholder="Tulis pertanyaan tentang dokumen...">
    <button id="btn">Kirim Pertanyaan</button>
  </form>
  <div id="pesan" class="pesan info">⏳ Pertanyaan dikirim... Muat ulang halaman dalam 20–30 detik untuk melihat jawaban.</div>
  <div id="riwayat">$TAMPILAN</div>
  <script>
    const URL = "https://script.google.com/macros/s/AKfy.../exec"; // GANTI URL-MU
    async function kirim(e){
      e.preventDefault();
      const q = document.getElementById("q").value.trim();
      if(!q)return alert("Tulis pertanyaan dulu!");
      document.getElementById("btn").disabled = true;
      document.getElementById("btn").textContent = "Mengirim...";
      document.getElementById("pesan").style.display = "block";
      await fetch(URL+"?q="+encodeURIComponent(q));
      document.getElementById("btn").disabled = false;
      document.getElementById("btn").textContent = "Kirim Pertanyaan";
    }
  </script>
</body>
</html>
AKHIR

      - name: Simpan
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Jawaban langsung di halaman utama" || true
          git push
