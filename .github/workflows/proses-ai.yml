name: AI — Apps Script + Cerebras

on:
  repository_dispatch:
    types:
      - dari-apps-script

jobs:
  proses:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Ambil salinan kode
        uses: actions/checkout@v4

      - name: Buat file jawaban
        env:
          DOKUMEN: ${{ github.event.client_payload.dokumen }}
          PERTANYAAN: ${{ github.event.client_payload.pertanyaan }}
        run: |
          if [ "$PERTANYAAN" = "perbarui-saja" ]; then
            JAWABAN="Dokumen berhasil diperbarui! Panjang teks: $(echo "$DOKUMEN" | wc -c) karakter. Buka halaman utama untuk menanya."
          else
            JAWABAN="Pertanyaan diterima: $PERTANYAAN"
          fi
          
          cat > jawaban.html << 'ENDHTML'
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jawaban — SISTAJA</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 3rem auto; padding: 0 1rem; }
    h1 { color: #1e40af; }
    .kotak { background: #f0f9ff; padding: 1.5rem; border-radius: 10px; border-left: 5px solid #3b82f6; }
    a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <h1>📄 Jawaban</h1>
  <div class="kotak">
    <p>JAWABAN_DISINI</p>
  </div>
  <p><a href="index.html">← Kembali ke Halaman Utama</a></p>
</body>
</html>
ENDHTML

          sed -i "s|JAWABAN_DISINI|$JAWABAN|" jawaban.html

      - name: Simpan & unggah
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jawaban.html
          git commit -m "Perbarui jawaban" || true
          git push
