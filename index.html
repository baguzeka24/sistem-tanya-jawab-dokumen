<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI SISTAJA - Sistem Tanya Jawab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    h1 { color: #1e40af; font-size: 1.5rem; }
    .kotak { background: #f0f9ff; padding: 1.5rem; border-radius: 10px; border-left: 4px solid #3b82f6; margin: 1.5rem 0; }
    input { width: 100%; padding: 0.9rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; margin-bottom: 1rem; }
    button { background: #2563eb; color: white; border: none; padding: 0.9rem 1.5rem; border-radius: 8px; font-size: 1rem; cursor: pointer; width: 100%; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .pesan { margin-top: 1rem; padding: 1rem; border-radius: 8px; display: none; }
    .sukses { background: #ecfdf5; border-left: 4px solid #10b981; display: block; }
    .salah { background: #fef2f2; border-left: 4px solid #ef4444; display: block; }
    a { color: #2563eb; text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
  <h1>⚡ AI SISTAJA — Tanya Dokumen Folder Drive</h1>

  <div class="kotak">
    <h3 style="margin-top:0;">💬 Tulis Pertanyaan</h3>
    <input type="text" id="pertanyaan" placeholder="Contoh: Apa isi utama dokumen ini?">
    <button id="tombolKirim" onclick="kirimPertanyaan()">Kirim Pertanyaan</button>
    <p style="font-size:0.9rem;color:#64748b;margin-top:0.8rem;">Sistem mencari jawaban dari semua file di Google Drive</p>
  </div>

  <div id="pesan" class="pesan"></div>

  <script>
    // === GANTI DENGAN URL WEB APP DARI GOOGLE APPS SCRIPT ===
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwcUkqUcst5YayjfycNQc5DNtkCsoTSH5mve5zvgoXdBN_V0TTfKDPZ1qYcKOuA7reX/exec";
    // =========================================================

    async function kirimPertanyaan() {
      const pertanyaan = document.getElementById("pertanyaan").value.trim();
      const tombol = document.getElementById("tombolKirim");
      const pesan = document.getElementById("pesan");

      if (!pertanyaan) {
        pesan.className = "pesan salah";
        pesan.textContent = "⚠️ Silakan tulis pertanyaan dulu!";
        return;
      }

      tombol.disabled = true;
      tombol.textContent = "⏳ Mengirim...";
      pesan.className = "pesan";
      pesan.textContent = "";

      try {
        const res = await fetch(`${APPS_SCRIPT_URL}?q=${encodeURIComponent(pertanyaan)}`);
        
        if (!res.ok) throw new Error("Koneksi gagal");

        pesan.className = "pesan sukses";
        pesan.innerHTML = "✅ Pertanyaan dikirim!<br>Buka <a href='jawaban.html' target='_blank'><strong>jawaban.html</strong></a> dalam 20–30 detik untuk melihat jawabannya.";

      } catch (err) {
        pesan.className = "pesan salah";
        pesan.innerHTML = "❌ Kesalahan: " + err.message + "<br>Pastikan URL Web App sudah benar dan sudah di-deploy.";
      }

      tombol.disabled = false;
      tombol.textContent = "Kirim Pertanyaan";
    }
  </script>
</body>
</html>
