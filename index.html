<!DOCTYPE html>
<html>
<head>
  <title>AI SISTAJA - Sistem Tanya Jawab</title>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .kotak { background: #f5f5f5; padding: 1.5rem; border-radius: 10px; margin: 1rem 0; }
    textarea, input { width: 100%; padding: 0.8rem; margin: 0.5rem 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
    button { background: #e63946; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .jawaban { margin-top: 1rem; padding: 1rem; background: #fff0f0; border-radius: 6px; display: none; white-space: pre-wrap; }
    .info { font-size: 0.9rem; color: #666; margin-top: 0.5rem; }
  </style>
</head>
<body>

  <h1>⚡ AI Tanya Dokumen — Cerebras</h1>

  <div class="kotak">
    <h3>1. Masukkan Dokumen</h3>
    <textarea id="dokumen" rows="6" placeholder="Tempel isi dokumen di sini..."></textarea>
  </div>

  <div class="kotak">
    <h3>2. Tanyakan Sesuatu</h3>
    <input type="text" id="pertanyaan" placeholder="Contoh: Apa inti dokumen ini?">
    <br><br>
    <button id="tombolKirim" onclick="mulaiTanya()">Kirim Pertanyaan</button>
    <p class="info">⚠️ Pertama kali butuh waktu ~10-30 detik</p>
  </div>

  <div id="hasil" class="jawaban"></div>

  <script>
    // === UBAH BAGIAN INI ===
    const REPO_OWNER = "baguzeka24";   // contoh: "budi123"
    const REPO_NAME = "baguzeka24/sistem-tanya-jawab-dokumen
";
    // ========================

    async function mulaiTanya() {
      const dokumen = document.getElementById('dokumen').value;
      const pertanyaan = document.getElementById('pertanyaan').value;
      const tombol = document.getElementById('tombolKirim');
      const hasil = document.getElementById('hasil');

      if (!dokumen || !pertanyaan) {
        alert("Isi dokumen dan pertanyaan dulu!");
        return;
      }

      tombol.disabled = true;
      tombol.textContent = "⏳ Memproses...";
      hasil.style.display = "block";
      hasil.textContent = "Mengirim ke sistem...";

      try {
        const res = await fetch(
          `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/dispatches`,
          {
            method: "POST",
            headers: {
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              event_type: "tanya-ai",
              client_payload: {
                dokumen: dokumen,
                pertanyaan: pertanyaan
              }
            })
          }
        );

        if (!res.ok) throw new Error("Kode: " + res.status);

        hasil.innerHTML = "✅ Permintaan dikirim! <br>";
        hasil.innerHTML += "Buka halaman <strong>jawaban.html</strong> dalam 15-30 detik untuk melihat hasilnya.";

      } catch (err) {
        hasil.innerHTML = "❌ Kesalahan: " + err.message + "<br>";
        hasil.innerHTML += "Pastikan nama pemilik dan nama repositori sudah benar.";
      }

      tombol.disabled = false;
      tombol.textContent = "Kirim Pertanyaan";
    }
  </script>

</body>
</html>
